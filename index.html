<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070e" />
  <meta name="description" content="Apexware — Minimalistic Obsidian Frosted Glass game library linking live builds and GitHub repositories." />
  <meta property="og:title" content="Apexware — Game Library" />
  <meta property="og:description" content="Playable web games and GitHub repositories by Apexware." />
  <meta property="og:type" content="website" />
  <title>Apexware — Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Subtle Obsidian Ambient Backdrop -->
  <div class="ambient-stage" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Minimalistic Obsidian Frosted Top Bar -->
  <header class="top-nav-wrap">
    <nav class="top-nav glass-obsidian-frosted pointer-reactive" aria-label="Library navigation">
      <a href="./" class="brand">
        <span class="brand-orb" aria-hidden="true"></span>
        <span>APEXWARE</span>
        <span class="brand-count" id="library-count">2</span>
      </a>

      <div class="nav-controls">
        <label class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="game-search"
            type="search"
            placeholder="Search library..."
            aria-label="Search games in library"
          />
        </label>

        <a
          class="gh-link"
          href="https://github.com/TrySmthNew993"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub ↗
        </a>
      </div>
    </nav>
  </header>

  <main class="library-main">
    <!-- Steam-like Library Filter & Sort Shelf -->
    <section class="library-bar" aria-label="Library filters">
      <div class="filter-pills" role="tablist" aria-label="Filter games">
        <button class="filter-pill active" type="button" data-filter="all">All Games</button>
        <button class="filter-pill" type="button" data-filter="favorites">★ Favorites</button>
        <button class="filter-pill" type="button" data-filter="racing">Racing</button>
        <button class="filter-pill" type="button" data-filter="simulation">Simulation</button>
        <button class="filter-pill" type="button" data-filter="strategy">Strategy</button>
        <button class="filter-pill" type="button" data-filter="sandbox">Sandbox</button>
      </div>

      <div class="sort-wrap">
        <select id="sort-select" class="sort-select" aria-label="Sort games">
          <option value="default">Sort: Featured</option>
          <option value="az">Sort: A – Z</option>
          <option value="favorites">Sort: Favorites First</option>
        </select>
      </div>
    </section>

    <!-- Game Grid -->
    <section aria-label="Games grid">
      <div class="games-grid" id="games-grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- Steam-like Game Details Modal -->
  <div class="modal-backdrop" id="game-modal" hidden>
    <div
      class="modal-panel glass-obsidian-frosted pointer-reactive"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <button class="modal-close" id="modal-close" type="button" aria-label="Close details">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="./games.js"></script>
  <script src="./app.js"></script>
</body>
</html>
